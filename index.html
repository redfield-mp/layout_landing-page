<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBike</title>
    <link rel="icon" href="src/images/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Ubuntu:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/main.scss" />
    <script src="src/scripts/main.js" defer></script>
  </head>
  <body>
    <input type="checkbox" id="menu-toggle" class="menu-toggle" />

    <div class="page">
      <nav class="menu">
        <div class="menu__content container">
          <div class="menu__top">
            <a href="#" class="menu__logo">
              <img src="src/images/logo.svg" alt="MyBike" class="menu__logo-img" />
            </a>
            <label for="menu-toggle" class="menu__close">
              <img src="src/images/icon-close.svg" alt="Close menu" class="menu__close-icon" />
            </label>
          </div>

          <ul class="menu__nav">
            <li><a href="#home" class="menu__nav-link">Home</a></li>
            <li><a href="#about" class="menu__nav-link">About Us</a></li>
            <li><a href="#compare" class="menu__nav-link">Compare Bikes</a></li>
            <li><a href="#details" class="menu__nav-link">Details</a></li>
            <li><a href="#contacts" class="menu__nav-link">Contacts</a></li>
          </ul>

          <div class="menu__bottom">
            <a href="tel:+12345555555" class="menu__phone">+1 234 5555-55-55</a>
            <a href="#contacts" class="menu__book">Book a test ride</a>
          </div>
        </div>
      </nav>

      <header class="header">
        <div class="container header__content">
          <a href="#" class="header__logo">
            <img
              src="src/images/logo.svg"
              alt="MyBike"
              class="header__logo-img"
            />
          </a>

          <div class="header__actions">
            <a href="tel:+12345555555" class="header__phone">
              <img src="src/images/icon-phone.svg" alt="Call us" />
            </a>

            <label for="menu-toggle" class="header__burger">
              <img src="src/images/icon-burger.svg" alt="Open menu" />
            </label>
          </div>
        </div>
      </header>
    </div>
  </body>
</html>
